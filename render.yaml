# RentHub Backend - Render Blueprint
# Define a managed disk for persistent uploads/logs, plus env vars.
# Render auto-provisions HTTPS and lets you attach a custom domain.

services:
  - type: web
    name: renthub-backend
    runtime: node
    plan: starter
    region: oregon
    rootDir: renthub-backend
    buildCommand: npm ci && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /api/v1/health/readiness
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: API_VERSION
        value: v1
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://yourdomain.com
      - key: TRUST_PROXY
        value: "true"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: RentHub <no-reply@yourdomain.com>
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:no-reply@yourdomain.com
      - key: LOG_LEVEL
        value: info
      - key: SENTRY_DSN
        sync: false
    disk:
      name: renthub-data
      mountPath: /app/uploads
      sizeGB: 1
